plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ccompile.lite'
    compileSdk 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId "com.ccompile.lite"
        minSdk 24
        targetSdk 28
        versionCode 8
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.2'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.9'

    implementation project(':terminal-view')
}

def bootstrapArch = 'aarch64'
def bootstrapAssetsDir = file("$projectDir/src/main/assets/termux-bootstrap")
def bootstrapZipFile = file("$bootstrapAssetsDir/bootstrap-${bootstrapArch}.zip")

def bootstrapRemoteUrl = "https://github.com/ardhiannizar12-pixel/Link-update-apk/releases/download/Termux/bootstrap-aarch64.zip"
// Bundled fork bootstrap; the remote URL is retained only as a recovery fallback.
def bootstrapExpectedSha256 = "5bf922e8c39c8a976dab00c2087076392d4acd05cac34eb4a661497c1b62a09b"

def sha256Of(File f) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    f.eachByte(4096) { buffer, len -> digest.update(buffer, 0, len) }
    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    return checksum
}

tasks.register('downloadTermuxBootstrap') {
    outputs.file(bootstrapZipFile)
    onlyIf {
        !(bootstrapZipFile.exists() && sha256Of(bootstrapZipFile) == bootstrapExpectedSha256)
    }
    doLast {
        bootstrapAssetsDir.mkdirs()
        logger.quiet("Downloading Termux bootstrap: $bootstrapRemoteUrl")
        new URL(bootstrapRemoteUrl).openStream().withStream { input ->
            bootstrapZipFile.newOutputStream().withStream { output -> output << input }
        }
        def actualChecksum = sha256Of(bootstrapZipFile)
        if (actualChecksum != bootstrapExpectedSha256) {
            bootstrapZipFile.delete()
            throw new GradleException("Bootstrap checksum mismatch!\nExpected: $bootstrapExpectedSha256\nActual:   $actualChecksum")
        }
        logger.quiet("Bootstrap downloaded successfully: $bootstrapZipFile (${bootstrapZipFile.length()} bytes)")
    }
}

preBuild.dependsOn('downloadTermuxBootstrap')